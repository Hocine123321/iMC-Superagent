name: Horizon
options:
  bundleIdPrefix: dev.imc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.imc.horizon
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "Horizon.entitlements"]
      # The app icon (light, dark and tinted), drawn by tools/make_app_icon.py (python3 tools/make_app_icon.py regenerates the PNGs).
      - path: Assets.xcassets
      # Horizon's third-party notices travel with the app (docs/IOS_FEASIBILITY_REPORT.md 11.3, item 12:
      # a binary distribution must carry them). Taken straight from the untouched upstream snapshot, so
      # there is no copy to drift and nothing in horizon/ changes. The About page reads it from the bundle.
      - path: ../../horizon/THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The MIT licence requires its notice to travel with binary copies. Bundled from the upstream file itself
      # (horizon/LICENSE), so nothing is copied into the source and nothing can drift.
      - path: ../../horizon/LICENSE
        buildPhase: resources
    # XcodeGen writes App/Info.plist from these properties at generation time, replacing whatever
    # the file held (a bare `path:` produced a 743-byte plist without our keys).
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iMC Horizon
        CFBundleName: iMC Horizon
        # Stamped by CI (ios-app.yml, "Work out the version"): the release number vN is CFBundleVersion and
        # HZBuildTag, the commit is HZCommit. A local build keeps the defaults under settings below.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        HZBuildTag: "$(HZ_BUILD_TAG)"
        HZCommit: "$(HZ_COMMIT)"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        # The launcher is portrait; the game window asks for landscape only (horizon-client-input window.rs).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        # The Files app shows Documents/Horizon, where the player puts the prepared game files.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Joining or hosting a LAN world sends and listens on the local network (Minecraft's LAN
        # announcement is UDP multicast on 224.0.2.60:4445, not Bonjour, so no NSBonjourServices).
        # Without this text iOS 14 and later blocks local traffic and shows no prompt.
        NSLocalNetworkUsageDescription: iMC Horizon uses your local network to find and join Minecraft worlds hosted on other devices in your home.
        # The owner's own Azure app (docs/IOS_SIGN_IN.md). Empty until it is registered and Mojang has
        # approved it; the Account screen says so. A GitHub repository variable HZ_MSA_CLIENT_ID fills it
        # (a client ID is public, not a secret). A build never carries another application's ID; the owner's
        # private test mode (docs/IOS_SIGN_IN.md, "Test mode") reads one from the phone, not from here.
        HZMicrosoftClientID: "$(HZ_MSA_CLIENT_ID)"
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        # Version defaults for a local build; CI passes its own on the xcodebuild line.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        HZ_BUILD_TAG: "dev"
        HZ_COMMIT: "local"
        # Empty unless the build passes HZ_MSA_CLIENT_ID (xcodebuild HZ_MSA_CLIENT_ID=...): no sign-in then.
        HZ_MSA_CLIENT_ID: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Where CI (or scripts/build-rust.sh) leaves the staticlib for the SDK being built.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/build/rust/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/build/rust/sim"
        OTHER_LDFLAGS: ["-lhorizon_ios_bridge", "-lc++"]
        # The SwiftUI launcher (App/Swift) calls the Objective-C launcher logic through this header.
        CODE_SIGN_ENTITLEMENTS: App/Horizon.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/HorizonApp-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        # Swift's runtime libraries are in the OS from iOS 12.2, so the deployment target of 16 needs none embedded.
        SWIFT_STRICT_CONCURRENCY: minimal
    # Frameworks the Rust crates (winit, wgpu-hal/Metal, cpal/CoreAudio, gilrs/IOKit) call into.
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: IOSurface.framework
