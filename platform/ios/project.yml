name: Horizon
options:
  bundleIdPrefix: dev.imc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.imc.horizon
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      # The app icon (light, dark and tinted), drawn by tools/make_app_icon.py (python3 tools/make_app_icon.py regenerates the PNGs).
      - path: Assets.xcassets
    # XcodeGen writes App/Info.plist from these properties at generation time, replacing whatever
    # the file held (a bare `path:` produced a 743-byte plist without our keys).
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iMC Horizon
        CFBundleName: iMC Horizon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        # The Files app shows Documents/Horizon, where the player puts the prepared game files.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Joining or hosting a LAN world sends and listens on the local network (Minecraft's LAN
        # announcement is UDP multicast on 224.0.2.60:4445, not Bonjour, so no NSBonjourServices).
        # Without this text iOS 14 and later blocks local traffic and shows no prompt.
        # The owner's own Azure app (docs/IOS_SIGN_IN.md). Empty until it is registered and Mojang has
        # approved it; the Account screen says so. A GitHub repository variable HZ_MSA_CLIENT_ID fills it
        # (a client ID is public, not a secret). Never another application's ID.
        HZMicrosoftClientID: "$(HZ_MSA_CLIENT_ID)"
        NSLocalNetworkUsageDescription: iMC Horizon uses your local network to find and join Minecraft worlds hosted on other devices in your home.
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        # Empty unless the build passes HZ_MSA_CLIENT_ID (xcodebuild HZ_MSA_CLIENT_ID=...): no sign-in then.
        HZ_MSA_CLIENT_ID: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Where CI (or scripts/build-rust.sh) leaves the staticlib for the SDK being built.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/build/rust/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/build/rust/sim"
        OTHER_LDFLAGS: ["-lhorizon_ios_bridge", "-lc++"]
    # Frameworks the Rust crates (winit, wgpu-hal/Metal, cpal/CoreAudio, gilrs/IOKit) call into.
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: IOSurface.framework
