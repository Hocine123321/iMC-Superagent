name: iOS app

# Assembles the Xcode project, links the Rust static library into a real .app, and
# reports what it is (size, linked frameworks, entitlements). Nothing here signs the app.
on:
  push:
    branches: [main]
    paths: ["horizon/crates/**", "horizon/platform/**", "horizon/Cargo.*", "platform/**", ".github/workflows/ios-app.yml"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Horizon.app (${{ matrix.sdk }})
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: iphoneos,        rust: aarch64-apple-ios,     dir: device, dest: "generic/platform=iOS" }
          - { sdk: iphonesimulator, rust: aarch64-apple-ios-sim, dir: sim,    dest: "generic/platform=iOS Simulator" }
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust }}
          brew install xcodegen
      # One cache per target. The device and simulator jobs used to share a key, so one blocked
      # the other's save and neither restored: every run recompiled the engine (23-25 minutes).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
          shared-key: app-${{ matrix.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Rust static library
        working-directory: horizon
        run: |
          cargo build --locked --release --target ${{ matrix.rust }} -p horizon-ios-bridge
          mkdir -p ../platform/ios/build/rust/${{ matrix.dir }}
          cp target/${{ matrix.rust }}/release/libhorizon_ios_bridge.a ../platform/ios/build/rust/${{ matrix.dir }}/
      - name: Generate the Xcode project
        working-directory: platform/ios
        run: xcodegen generate
      - name: Build the app (unsigned)
        working-directory: platform/ios
        run: |
          set -o pipefail
          xcodebuild -project Horizon.xcodeproj -scheme Horizon -configuration Release \
            -sdk ${{ matrix.sdk }} -destination "${{ matrix.dest }}" \
            -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS= \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../../xcodebuild.log | tail -60
      - name: What was built
        working-directory: platform/ios
        run: |
          APP=$(find build/dd -name Horizon.app -maxdepth 6 | head -1); echo "APP=$APP"
          ls -la "$APP"; du -sh "$APP"
          echo "--- executable:"; file "$APP/Horizon"; ls -la "$APP/Horizon"
          echo "--- entry point present:"; nm -gU "$APP/Horizon" | grep -E "horizon_ios_main| _main$" || true
          echo "--- linked libraries:"; otool -L "$APP/Horizon" | sed 's/(compatibility.*//' | head -40
          echo "--- the built Info.plist (orientations, full screen, file sharing):"
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist" | grep -E "UISupportedInterfaceOrientations|Landscape|Portrait|UIRequiresFullScreen|UIFileSharingEnabled|LSSupportsOpening|UIStatusBarHidden|MinimumOSVersion" || echo "keys missing"
          wc -c "$APP/Info.plist"
          echo "--- minimum OS / platform:"; otool -l "$APP/Horizon" | grep -E -A4 "LC_BUILD_VERSION" | head -8
      - name: Launch on the iOS Simulator and record what happens
        if: matrix.sdk == 'iphonesimulator'
        working-directory: platform/ios
        run: |
          APP=$(find build/dd -name Horizon.app -maxdepth 6 | head -1)
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-6]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          OUT=../../sim; mkdir -p $OUT

          run_once() {  # $1 = label
            xcrun simctl terminate "$UDID" dev.imc.horizon 2>/dev/null || true
            xcrun simctl launch --console-pty "$UDID" dev.imc.horizon > $OUT/$1-console.log 2>&1 &
            LPID=$!
            sleep 40
            xcrun simctl io "$UDID" screenshot $OUT/$1-screen.png || true
            echo "[$1] process alive after 40 s?"
            xcrun simctl spawn "$UDID" launchctl list | grep -i horizon || echo "[$1] NOT RUNNING"
            echo "[$1] console:"; head -40 $OUT/$1-console.log
            kill $LPID 2>/dev/null || true
            xcrun simctl terminate "$UDID" dev.imc.horizon 2>/dev/null || true
          }

          echo "=== 1. no resources at all (a fresh install)"
          run_once fresh

          echo "=== 2. a stub horizon-resources.json (valid JSON, NO game data) to see what the loader needs next"
          DATA=$(xcrun simctl get_app_container "$UDID" dev.imc.horizon data)
          echo "container data: $DATA"
          mkdir -p "$DATA/Documents/Horizon/resources"
          echo '{}' > "$DATA/Documents/Horizon/resources/horizon-resources.json"
          run_once stub

          echo "=== files the app made in its container"
          find "$DATA/Documents" -maxdepth 4 | head -30
          echo "=== logs the engine wrote"
          for f in $(find "$DATA/Documents/Horizon/home" -name "latest.log" -o -name "*.log" | head -3); do echo "--- $f"; head -60 "$f"; done
          echo "=== crash reports"; ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i horizon || echo none
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphonesimulator'
        with:
          name: simulator-launch
          path: |
            sim/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log-${{ matrix.sdk }}
          path: xcodebuild.log
          retention-days: 7
      - name: Zip the unsigned app
        if: matrix.sdk == 'iphoneos'
        working-directory: platform/ios
        run: |
          APP=$(find build/dd -name Horizon.app -maxdepth 6 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry Horizon-unsigned.ipa Payload && ls -la Horizon-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphoneos'
        with:
          name: Horizon-unsigned-ipa
          path: platform/ios/Horizon-unsigned.ipa
          retention-days: 7
