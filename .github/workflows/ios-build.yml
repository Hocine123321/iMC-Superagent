name: iOS build

# Builds the Horizon engine for iOS on a macOS runner. This is the evidence
# source for "does it link?" (the Linux sandbox can only type-check).
on:
  push:
    branches: [main]
    paths: ["horizon/crates/**", "horizon/platform/**", "horizon/Cargo.*", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["horizon/crates/**", "horizon/platform/**", "horizon/Cargo.*"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-telemetry:
    name: footprint counters (macOS runner, same Mach API as iOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: horizon
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
      - name: Run the process_memory tests (reads task_info on a real Apple kernel)
        run: cargo test --locked -p horizon-threads process_memory -- --nocapture

  bridge:
    name: static library for the app (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios]
    defaults:
      run:
        working-directory: horizon
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain with iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
      - name: Build libhorizon_ios_bridge.a
        run: cargo build --locked --release --target ${{ matrix.target }} -p horizon-ios-bridge
      - name: The archive, its exported entry point, and its size
        run: |
          A=target/${{ matrix.target }}/release/libhorizon_ios_bridge.a
          ls -la "$A"
          echo "--- every symbol mentioning horizon_ios (nm, all symbols, with the object it is in):"
          nm -A "$A" 2>/dev/null | grep -i "horizon_ios" | head -20 || true
          echo "--- the entry point, exactly (defined external text symbol):"
          if nm -A -g --defined-only "$A" 2>/dev/null | grep -E "[ ]T[ ]_horizon_ios_main$"; then
            echo "FOUND _horizon_ios_main"
          else
            echo "NOT FOUND as a defined external symbol"; exit 1
          fi
          echo "--- architecture:"; lipo -info "$A"
          echo "--- platform and minimum OS recorded in the objects:"
          otool -l "$A" 2>/dev/null | grep -E "^\s+(platform|minos) " | sort | uniq -c | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: libhorizon_ios_bridge-${{ matrix.target }}
          path: horizon/target/${{ matrix.target }}/release/libhorizon_ios_bridge.a
          retention-days: 7

