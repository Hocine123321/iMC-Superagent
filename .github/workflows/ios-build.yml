name: iOS build

# Builds the Horizon engine for iOS on a macOS runner. This is the evidence
# source for "does it link?" (the Linux sandbox can only type-check).
on:
  push:
    branches: [main]
    paths: ["horizon/**", "platform/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["horizon/**", "platform/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-telemetry:
    name: footprint counters (macOS runner, same Mach API as iOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: horizon
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
      - name: Run the process_memory tests (reads task_info on a real Apple kernel)
        run: cargo test --locked -p horizon-threads process_memory -- --nocapture

  bridge:
    name: static library for the app (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    defaults:
      run:
        working-directory: horizon
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain with iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
      - name: Build libhorizon_ios_bridge.a
        run: cargo build --locked --release --target ${{ matrix.target }} -p horizon-ios-bridge
      - name: The archive, its exported entry point, and its size
        run: |
          A=target/${{ matrix.target }}/release/libhorizon_ios_bridge.a
          ls -la "$A"
          echo "--- exported symbol:"; nm -gU "$A" 2>/dev/null | grep -E " T _horizon_ios_main$" || { echo "MISSING horizon_ios_main"; exit 1; }
          echo "--- architecture:"; lipo -info "$A"
          echo "--- minimum OS recorded in the objects (sample):"; otool -l "$A" 2>/dev/null | grep -E "minos|platform" | sort | uniq -c | head -6
      - uses: actions/upload-artifact@v4
        with:
          name: libhorizon_ios_bridge-${{ matrix.target }}
          path: horizon/target/${{ matrix.target }}/release/libhorizon_ios_bridge.a
          retention-days: 7

  engine:
    name: ${{ matrix.target }} (${{ matrix.package }})
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow_failure }}
    env:
      # Rust's default iOS target is 10.0, which lacks ___chkstk_darwin (needed by mimalloc's C code)
      # and os_proc_available_memory (iOS 13). 16.0 is a working choice, not a final support decision.
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Crates that are expected to pass on the unmodified upstream snapshot.
          - { target: aarch64-apple-ios,     package: horizon-world,         allow_failure: false }
          - { target: aarch64-apple-ios,     package: horizon-protocol,      allow_failure: false }
          # The renderer and client: the known blockers B1-B4 live here
          # (docs/IOS_FEASIBILITY_REPORT.md section 3). Allowed to fail until fixed.
          - { target: aarch64-apple-ios,     package: horizon-client-lib,    allow_failure: true }
          - { target: aarch64-apple-ios,     package: horizon-client,        allow_failure: true }
          - { target: aarch64-apple-ios-sim, package: horizon-client-lib,    allow_failure: true }
    defaults:
      run:
        working-directory: horizon
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain with iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version; xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
      - name: "Build (release; links the C crates ring and mimalloc)"
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --release --target ${{ matrix.target }} -p ${{ matrix.package }} 2>&1 | tee ../build.log
      - name: Footprint of the result
        if: always()
        run: |
          ls -la target/${{ matrix.target }}/release/*.a target/${{ matrix.target }}/release/horizon-client 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.target }}-${{ matrix.package }}
          path: build.log
