name: iOS SDK probe
# One-off diagnostics on a real Apple SDK: header layouts and sysctl/os availability.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: task_vm_info layout from the iOS SDK header
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); echo "SDK=$SDK"; xcodebuild -version
          H="$SDK/usr/include/mach/task_info.h"
          awk '/^struct task_vm_info/,/^typedef struct task_vm_info/' "$H" | grep -v '^\s*$' | head -90
          grep -n "TASK_VM_INFO\b\|TASK_VM_INFO_COUNT\|TASK_VM_INFO_REV" "$H" | head
      - name: Layout check against the SDK headers
        run: |
          cat > /tmp/l.c <<'EOC'
          #include <mach/task_info.h>
          #include <stddef.h>
          #include <stdio.h>
          int main(void){
            printf("sizeof(task_vm_info_data_t)=%zu\n", sizeof(task_vm_info_data_t));
            printf("TASK_VM_INFO=%d COUNT=%zu REV1_COUNT=%zu\n", TASK_VM_INFO, (size_t)TASK_VM_INFO_COUNT, (size_t)TASK_VM_INFO_REV1_COUNT);
            printf("off phys_footprint=%zu\n", offsetof(task_vm_info_data_t, phys_footprint));
            printf("off internal=%zu compressed=%zu resident_size=%zu\n", offsetof(task_vm_info_data_t, internal), offsetof(task_vm_info_data_t, compressed), offsetof(task_vm_info_data_t, resident_size));
            printf("off limit_bytes_remaining=%zu\n", offsetof(task_vm_info_data_t, limit_bytes_remaining));
            printf("off ledger_phys_footprint_peak=%zu\n", offsetof(task_vm_info_data_t, ledger_phys_footprint_peak));
            return 0; }
          EOC
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fsyntax-only /tmp/l.c && echo "iphoneos header compiles"
          xcrun --sdk macosx clang /tmp/l.c -o /tmp/l_mac && /tmp/l_mac
      - name: os_proc_available_memory in the iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          grep -n "os_proc_available_memory" -B3 "$SDK/usr/include/os/proc.h"
      - name: malloc_zone_pressure_relief in the iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          grep -rn "malloc_zone_pressure_relief" "$SDK/usr/include/malloc/" | head -3
          echo "tbd export check:"; grep -c "malloc_zone_pressure_relief" "$SDK/usr/lib/system/libsystem_malloc.tbd" || true
      - name: sysctl hw.perflevel0 availability notes
        run: |
          sysctl hw.perflevel0.physicalcpu hw.ncpu 2>&1 | head -3
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); grep -c "sysctlbyname" "$SDK/usr/include/sys/sysctl.h"
